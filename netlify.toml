# Tomchi — Vite site + Telegram bot functions (webhook + scheduled reminder).
[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# These keys are public by design — the Supabase project URL and the anon /
# publishable key ship in the client bundle (protected by row-level security).
# Exclude them from secrets scanning; the real secrets (service-role key, bot
# token, webhook secret) stay scanned because they must never appear in output.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL,VITE_SUPABASE_URL,VITE_SUPABASE_ANON_KEY"

[functions]
  node_bundler = "esbuild"

# Security headers (baseline web standards; CSP kept permissive enough for
# data:-URL NDVI images, Esri map tiles and inline Vite styles).
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(self), geolocation=(self)"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data: blob: https://server.arcgisonline.com; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https://*.supabase.co https://api.open-meteo.com; font-src 'self' data:; frame-ancestors 'none'"

# SPA fallback (safe even though the app is single-page)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

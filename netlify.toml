# Tomchi — Vite site + Telegram bot functions (webhook + scheduled reminder).
[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# SPA fallback (safe even though the app is single-page)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false
